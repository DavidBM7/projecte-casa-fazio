<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reserva</title>
    <link rel="stylesheet" href="/css/reserva.css">
</head>
<body>
    <header>
        <img src="/assets/img/logo.png" alt="logo">
        <nav>
            <img id="menu" src="/assets/img/menu.png" alt="menu">
            <div id="menu-links">
                <p id="home">Home</p>
                <p id="carta">Carta</p>
                <p id="reserves">Reserves</p>
                <p>Nosaltres</p>
                <p>Contacte</p>
            </div>
        </nav>
    </header>
    <main>
        <h1>Reservar</h1>
        <form>
            <label>
                <h3>NOMBRE</h3>
                <input type="text" name="nom" id="nom">
            </label>
            <label>
                <h3>EMAIL</h3>
                <input type="text" name="email" id="email">
            </label>
            <label>
                <h3>DIA DE LA RESERVA</h3>
                <input type="date" name="dia" id="dia">
            </label>
            <label>
                <h3>HORA DE LA RESERVA</h3>
                <input type="time" name="hora" id="hora">
            </label>
            <label>
                <h3>NUMERO DE PERSONAS</h3>
                <input type="text" name="nPersones" id="nPersones">
            </label>
            <label>
                <h3>COMENTARIO</h3>
                <input type="text" name="comentari" id="comentari">
            </label>
            <input type="submit" value="RESERVAR">
        </form>
    </main>
    <footer>
        <section>
            <h4>Nuestros horarios</h4>
            <p>Lunes-Sabado</p>
            <p>10:00 AM - 10:30 PM</p>
        </section>
        <section>
            <h4>¿Donde encontrarnos?</h4>
            <p>Carrer porrasar nou 56</p>
            <p>07730 Alaior, Menorca</p>
        </section>
        <section>
            <h4>Contacto</h4>
            <p>+34 689 45 34 33</p>
            <a href="#">Instagram</a>
        </section>
    </footer>
    <script src="/js/home.js"></script>
    <script src="/js/navegacio.js"></script>
    <script src="/js/reserva.js"></script>
</body>
</html>
